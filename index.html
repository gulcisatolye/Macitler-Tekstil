<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Macitler Tekstil</title>
<meta name="description" content="Macitler Tekstil - Eşarp, Şal, Başörtüsü | Trendyol, Instagram ve WhatsApp sipariş hattı">
<style>
  :root{
    --gold:#e8c26a;
    --gold-2:#b8893a;
    --ink:#0b0b12;
    --glass:rgba(255,255,255,.09);
    --glass-b:rgba(255,255,255,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#fff;overflow-x:hidden;display:flex;justify-content:center;
    background:
      radial-gradient(60% 38% at 50% 0%,rgba(232,194,106,.28),transparent 70%),
      radial-gradient(70% 40% at 50% 100%,rgba(184,137,58,.14),transparent 70%),
      linear-gradient(180deg,#14141e 0%,#0b0b12 55%,#050508 100%);
    background-attachment:fixed;
  }

  .wrap{
    position:relative;width:100%;max-width:460px;min-height:100vh;
    padding:max(34px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  }

  .brand{text-align:center;animation:rise .8s ease both}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* Yuvarlak logo: logo.png */
  .badge{
    width:min(62vw,250px);aspect-ratio:1/1;margin:0 auto;border-radius:50%;
    padding:3px;background:linear-gradient(135deg,var(--gold),var(--gold-2),var(--gold));
    box-shadow:0 0 0 1px rgba(232,194,106,.35),0 14px 50px rgba(232,194,106,.38);
    animation:glow 4s ease-in-out infinite alternate;
  }
  .badge img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#f1e8d8;
  }
  @keyframes glow{to{box-shadow:0 0 0 1px rgba(232,194,106,.5),0 16px 64px rgba(232,194,106,.55)}}

  .sub{margin-top:20px;font-size:13px;letter-spacing:.28em;color:rgba(255,255,255,.72);text-transform:uppercase}
  .line{width:64px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .btn{
    position:relative;display:flex;align-items:center;gap:16px;
    padding:16px 18px;border-radius:18px;text-decoration:none;color:#fff;
    background:var(--glass);border:1px solid var(--glass-b);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    transition:transform .2s ease,border-color .2s ease,background .2s ease;
    overflow:hidden;opacity:0;animation:rise .7s ease forwards;
  }
  .btn:nth-child(1){animation-delay:.15s}
  .btn:nth-child(2){animation-delay:.3s}
  .btn:nth-child(3){animation-delay:.45s}
  .btn::before{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
    transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite;
  }
  .btn:nth-child(2)::before{animation-delay:.6s}
  .btn:nth-child(3)::before{animation-delay:1.2s}
  @keyframes shine{0%{left:-60%}35%,100%{left:130%}}
  .btn:active{transform:scale(.97)}
  .btn:hover{border-color:var(--gold);background:rgba(255,255,255,.14)}

  .ico{
    flex:0 0 52px;height:52px;border-radius:15px;display:grid;place-items:center;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .ico svg{width:28px;height:28px;fill:#fff}
  .ty .ico{background:linear-gradient(135deg,#ff7a1a,#f27a1a 40%,#e0480a)}
  .ig .ico{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
  .wa .ico{background:linear-gradient(135deg,#2fe27a,#0a9f4a)}

  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:17px;font-weight:700;letter-spacing:.01em}
  .txt span{display:block;margin-top:3px;font-size:12.5px;color:rgba(255,255,255,.7)}
  .arrow{flex:0 0 auto;width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  footer{font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:.2em;text-align:center;text-transform:uppercase;animation:rise 1s .6s ease both}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
  <main class="wrap">
    <section class="brand">
      <h1 class="sr">Macitler Tekstil</h1>
      <div class="badge" id="badge"><img src="logo.png" alt="Macitler Tekstil logosu" onerror="document.getElementById('badge').style.display='none'"></div>
      <p class="sub">Resmi Mağaza Bağlantıları</p>
      <div class="line"></div>
    </section>

    <nav class="links">
      <a class="btn ty" href="https://ty.gl/jupo1lehj87on" target="_blank" rel="noopener">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 7h10l1.2 12.2a1 1 0 0 1-1 1.1H6.8a1 1 0 0 1-1-1.1L7 7zm2.2 0V6a2.8 2.8 0 0 1 5.6 0v1h-1.8V6a1 1 0 0 0-2 0v1H9.2z"/></svg></div>
        <div class="txt"><b>Trendyol Mağazamız</b><span>Ürünleri incele &amp; sipariş ver</span></div>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>

        <div class="ico"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.3-3.2a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg></div>
        <div class="txt"><b>Instagram</b><span>@macitlertekstil</span></div>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>

      <a class="btn wa" href="https://wa.me/905387489125?text=Merhaba%2C%20Macitler%20Tekstil%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum." target="_blank" rel="noopener">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.200zm4.5-6.1c-.2-.1-1.500-.7-1.700-.8-.2-.1-.4-.1-.6.100l-.8 1c-.1.200-.3.200-.5.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.100-.7.300-.8.800-1 1.700-.7 2.600.4 1.200 1.300 2.400 2.600 3.500 1.800 1.500 3.200 1.900 4.200 2.200.5.100 1.300.1 1.800-.3.400-.3.700-1 .8-1.600.100-.4 0-.6-.1-.7z"/></svg></div>
        <div class="txt"><b>WhatsApp Sipariş Hattı</b><span>+90 538 748 91 25</span></div>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </nav>

    <footer>Eşarp &bull; Şal &bull; Başörtüsü</footer>
  </main>
</body>
</html>
